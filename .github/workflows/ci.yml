name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agpl-boundary:
    name: AGPL boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no server-side AGPL usage
        run: ./scripts/check_agpl_boundary.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: ./scripts/check_secrets.sh

  flutter-analyse:
    name: Flutter app — analyse & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get
      - name: Verify formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyse
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

  flutter-build-android:
    name: Flutter app — build (Android)
    runs-on: ubuntu-latest
    needs: flutter-analyse
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get
      - name: Build APK (debug — unsigned)
        working-directory: app
        run: flutter build apk --debug

  flutter-build-ios:
    name: Flutter app — build (iOS)
    runs-on: macos-latest
    needs: flutter-analyse
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get
      - name: Build (no codesign)
        working-directory: app
        run: flutter build ios --debug --no-codesign

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: api
        run: npm ci || npm install
      - working-directory: api
        run: npm run lint --if-present
      - working-directory: api
        run: npm test --if-present
      - name: Build
        working-directory: api
        run: npm run build --if-present
