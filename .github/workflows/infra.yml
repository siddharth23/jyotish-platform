name: Infra

on:
  pull_request:
    branches: [main]
    paths: ['infra/**']
  push:
    branches: [main]
    paths: ['infra/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Terraform plan — single environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/single
    env:
      # Sensitive — Settings -> Secrets and variables -> Actions -> Secrets.
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      # Not sensitive (a public key, and the admin CIDR allowlist) — Variables tab, not Secrets.
      # INFRA_ALLOWED_SSH_CIDRS must be an HCL/JSON list literal, e.g. ["203.0.113.4/32"].
      TF_VAR_ssh_public_key: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
      TF_VAR_allowed_ssh_cidrs: ${{ vars.INFRA_ALLOWED_SSH_CIDRS }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="access_key=${{ secrets.HETZNER_OBJECT_STORAGE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.HETZNER_OBJECT_STORAGE_SECRET_KEY }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color
