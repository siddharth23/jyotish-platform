name: jyotish_app
description: Vedic astrology for the German market.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Must track whatever flutter_localizations pins, or version solving fails.
  intl: ^0.20.3
  flutter_riverpod: ^2.5.0
  go_router: ^17.4.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  dio: ^5.4.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  # Keychain on iOS, EncryptedSharedPreferences on Android (US-016 AC2).
  # Session tokens go here and never in shared_preferences.
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^7.3.1

  # AGPL engine — runs ON DEVICE only. See docs/AGPL-BOUNDARY.md.
  # jyotish_engine:
  #   git:
  #     url: https://github.com/sidkalaapcoa/jyotish-engine.git
  #     path: packages/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
